name: Kapi + Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  denetle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Bağımlılıklar
        run: npm install --no-audit --no-fund
      - name: Güvenlik Kapisı
        run: npm run kapi
      - name: Vite Build
        run: npm run build
